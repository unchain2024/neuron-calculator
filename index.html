<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEURON 料金シミュレーター</title>
<style>
  :root{
    --bg:#f1f4ec;
    --card:#ffffff;
    --border:#e2e7da;
    --border-soft:#eef1ea;
    --txt:#293330;
    --txt-mut:#74807a;
    --txt-dim:#a6b0a7;
    --green:#2f8f60;
    --green-deep:#1c6b45;
    --green-soft:#eaf4ed;
    --gold:#b07d23;
    --gold-soft:#f7f0df;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
    min-height:100%;display:flex;align-items:center;justify-content:center;
    padding:28px 18px;letter-spacing:.01em;
  }
  .card{
    width:100%;max-width:540px;position:relative;
    background:var(--card);
    border:1px solid var(--border);border-radius:20px;padding:34px 30px 26px;
    box-shadow:0 18px 50px rgba(40,60,50,.08);
  }
  /* header */
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:3px;}
  .logo{width:30px;height:30px;border-radius:9px;background:var(--green);
    display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(47,143,96,.35);}
  .logo svg{width:18px;height:18px;}
  .brand .name{font-size:19px;font-weight:700;letter-spacing:.16em;color:var(--green-deep);}
  .subtitle{color:var(--txt-mut);font-size:13.5px;margin:0 0 26px 2px;font-weight:500;}
  .eye{position:absolute;top:28px;right:28px;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
    background:#fbfcf9;color:var(--txt-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;}
  .eye:hover{color:var(--txt-mut);}
  .eye.on{color:var(--gold);border-color:#e3d3a6;background:var(--gold-soft);}
  .eye svg{width:17px;height:17px;}

  /* input blocks */
  .block{margin-bottom:22px;}
  .field-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .field-label .lbl{font-size:14.5px;color:var(--txt-mut);font-weight:600;}
  .val{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;color:var(--txt);}
  .val .u{font-size:14px;color:var(--txt-mut);margin-left:3px;font-weight:600;}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:7px;border-radius:99px;
    background:linear-gradient(90deg,var(--green) var(--pct,30%),#e2e7da var(--pct,30%));outline:none;margin:4px 0;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;
    background:#fff;border:5px solid var(--green);cursor:pointer;box-shadow:0 3px 10px rgba(47,143,96,.4);transition:transform .08s;}
  input[type=range]::-webkit-slider-thumb:active{transform:scale(1.12);}
  input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:5px solid var(--green);cursor:pointer;}
  .ticks{display:flex;justify-content:space-between;color:var(--txt-dim);font-size:11px;margin-top:2px;}

  .seg{display:flex;gap:6px;background:#f4f6f1;padding:5px;border-radius:12px;border:1px solid var(--border-soft);}
  .seg button{flex:1;border:none;background:transparent;color:var(--txt-mut);font:inherit;font-size:14px;font-weight:600;
    padding:11px 4px;border-radius:8px;cursor:pointer;transition:.15s;}
  .seg button.on{background:var(--green);color:#fff;box-shadow:0 3px 10px rgba(47,143,96,.3);}
  .seg-cap{font-size:11.5px;color:var(--txt-dim);margin-top:7px;text-align:center;}

  /* readout */
  .readout{margin:26px 0 6px;padding:22px 24px;border-radius:16px;
    background:var(--green-soft);border:1px solid #d6e8dd;}
  .init-row{display:flex;justify-content:space-between;align-items:baseline;}
  .init-row .cap{font-size:13px;color:var(--txt-mut);font-weight:600;}
  .init-row .iv{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold);}
  .init-row .iv .yen{font-size:15px;font-weight:700;}
  .init-sub{font-size:11px;color:var(--txt-dim);text-align:right;margin-top:3px;}
  .hr{height:1px;background:#d6e8dd;margin:16px -4px;}
  .cap2{font-size:13px;color:var(--txt-mut);font-weight:600;text-align:center;margin-bottom:6px;}
  .price{font-size:54px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;color:var(--green-deep);transition:opacity .12s;}
  .price .yen{font-size:32px;font-weight:700;margin-right:2px;vertical-align:6px;}
  .price .per{font-size:17px;color:var(--txt-mut);font-weight:600;margin-left:4px;}
  .annual{margin-top:8px;font-size:14px;color:var(--txt-mut);font-variant-numeric:tabular-nums;text-align:center;}
  .annual b{color:var(--txt);font-weight:700;}
  .contact .price{font-size:38px;}

  /* internal margin (hidden by default) */
  .internal{display:none;margin-top:18px;background:#fbfcf9;border:1px dashed #e3d3a6;
    border-radius:12px;padding:14px 16px;font-size:12.5px;font-variant-numeric:tabular-nums;}
  .internal.show{display:block;}
  .internal .ih{color:var(--gold);font-weight:700;font-size:11.5px;letter-spacing:.05em;margin-bottom:8px;}
  .mrow{display:flex;justify-content:space-between;padding:4px 0;color:var(--txt-mut);}
  .mrow b{color:var(--txt);font-weight:700;}
  .mrow.hi b{color:var(--green);}
  .foot{text-align:center;color:var(--txt-dim);font-size:11px;margin-top:18px;}
</style>
</head>
<body>
  <div class="card" id="card">
    <button class="eye" id="eye" title="社内用：粗利を表示/非表示">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
    </button>

    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M5 19V5l14 14V5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="name">NEURON</span>
    </div>
    <p class="subtitle">料金シミュレーター</p>

    <!-- 接続人数 -->
    <div class="block">
      <div class="field-label"><span class="lbl">接続人数</span><span class="val"><span id="seatNum">30</span><span class="u">人</span></span></div>
      <input type="range" id="slider" min="1" max="1000" value="30" step="1">
      <div class="ticks"><span>1</span><span>250</span><span>500</span><span>750</span><span>1,000+</span></div>
    </div>

    <!-- 過去データ取込期間 -->
    <div class="block">
      <div class="field-label"><span class="lbl">過去データ取込期間</span><span class="val" id="moLabel">12<span class="u">ヶ月</span></span></div>
      <div class="seg" id="segMonths">
        <button data-mo="6">6ヶ月</button>
        <button data-mo="12" class="on">12ヶ月</button>
        <button data-mo="18">18ヶ月</button>
        <button data-mo="24">24ヶ月</button>
      </div>
    </div>

    <!-- 更新頻度（価格非連動） -->
    <div class="block">
      <div class="field-label"><span class="lbl">データ更新頻度</span></div>
      <div class="seg" id="segRefresh">
        <button data-rf="5分ごと（ほぼリアルタイム）" class="on">5分</button>
        <button data-rf="1時間ごと">1時間</button>
        <button data-rf="1日1回">1日</button>
        <button data-rf="週1回">週1</button>
      </div>
      <div class="seg-cap" id="rfCap">5分ごと（ほぼリアルタイム）に最新の会話を解析</div>
    </div>

    <!-- 料金表示 -->
    <div class="readout" id="readout">
      <div class="init-row">
        <span class="cap">初期費用（導入時 1回）</span>
        <span class="iv" id="initVal"><span class="yen">￥</span>400,000</span>
      </div>
      <div class="init-sub" id="initSub">月額の2ヶ月分（過去12ヶ月分を解析）</div>
      <div class="hr"></div>
      <div class="cap2">月額料金</div>
      <div class="price" id="priceMain"><span class="yen">￥</span><span id="priceNum">200,000</span><span class="per">/ 月</span></div>
      <div class="annual" id="annual">年額 <b>￥2,400,000</b></div>
    </div>

    <!-- 社内：粗利（初期OFF） -->
    <div class="internal" id="internal">
      <div class="ih">社内参考（顧客非表示）</div>
      <div class="mrow"><span>月間処理トークン</span><b id="mTok">—</b></div>
      <div class="mrow"><span>月額 AI コスト (COGS)</span><b id="mCogs">—</b></div>
      <div class="mrow"><span>初期(取込) AI コスト</span><b id="mInit">—</b></div>
      <div class="mrow hi"><span>月額粗利率</span><b id="mMargin">—</b></div>
    </div>

    <div class="foot">数値は概算見積もり。確定金額は別途お見積もりいたします。</div>
  </div>

<script>
  // ── 月額料金テーブル（人数バンド定額・上側寄せ）──
  var TIERS=[
    {max:10,price:100000},{max:30,price:200000},{max:50,price:400000},
    {max:100,price:600000},{max:300,price:1500000},{max:500,price:2000000},{max:1000,price:3500000}
  ];
  // ── 初期費用 = 月額 × 係数（期間連動）──
  var COEF={6:1, 12:2, 18:2.5, 24:3};
  // ── COGS 固定デフォルト（社内）──
  var FX=155, RATE=4.27, MSG_PER_DAY=35, TOK_PER_MSG=20, WORK_DAYS=22;

  var state={seats:30, months:12};
  var $=function(id){return document.getElementById(id);};
  var fmt=function(n){return Math.round(n).toLocaleString('ja-JP');};
  function tierIndex(s){for(var i=0;i<TIERS.length;i++){if(s<=TIERS[i].max)return i;}return -1;}

  function render(){
    var s=state.seats, mo=state.months, coef=COEF[mo];
    $('seatNum').textContent=fmt(s);
    $('moLabel').innerHTML=mo+'<span class="u">ヶ月</span>';
    $('slider').style.setProperty('--pct',Math.min(100,(s/1000)*100)+'%');

    var idx=tierIndex(s), readout=$('readout');
    if(idx===-1){
      readout.classList.add('contact');
      $('initVal').innerHTML='要相談';
      $('initSub').textContent='1,000人超は個別見積もり';
      $('priceMain').innerHTML='<span style="color:var(--green-deep)">要相談</span>';
      $('annual').innerHTML='1,000人を超える規模は個別にお見積もりします';
    }else{
      readout.classList.remove('contact');
      var price=TIERS[idx].price, init=price*coef;
      $('initVal').innerHTML='<span class="yen">￥</span>'+fmt(init);
      $('initSub').textContent='月額の'+coef+'ヶ月分（過去'+mo+'ヶ月分を解析）';
      var pm=$('priceMain');pm.style.opacity=.35;setTimeout(function(){pm.style.opacity=1;},60);
      pm.innerHTML='<span class="yen">￥</span>'+fmt(price)+'<span class="per">/ 月</span>';
      $('annual').innerHTML='年額 <b>￥'+fmt(price*12)+'</b>';
    }

    // ── 社内：COGS / 粗利 ──
    var monthlyTok=s*MSG_PER_DAY*TOK_PER_MSG*WORK_DAYS;
    var cogsM=(monthlyTok/1e6)*RATE*FX;
    var cogsInit=(monthlyTok*mo/1e6)*RATE*FX;
    $('mTok').textContent=(monthlyTok/1e6).toFixed(2)+'M tok/月';
    $('mCogs').textContent='￥'+fmt(cogsM);
    $('mInit').textContent='￥'+fmt(cogsInit)+'（'+mo+'ヶ月分）';
    $('mMargin').textContent=(idx===-1)?'—':((TIERS[idx].price-cogsM)/TIERS[idx].price*100).toFixed(1)+'%';
  }

  $('slider').addEventListener('input',function(e){state.seats=parseInt(e.target.value,10);render();});
  $('segMonths').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    Array.prototype.forEach.call(this.children,function(x){x.classList.remove('on');});
    b.classList.add('on');state.months=parseInt(b.dataset.mo,10);render();
  });
  $('segRefresh').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    Array.prototype.forEach.call(this.children,function(x){x.classList.remove('on');});
    b.classList.add('on');$('rfCap').textContent=b.dataset.rf+'に最新の会話を解析';
  });
  $('eye').addEventListener('click',function(){this.classList.toggle('on');$('internal').classList.toggle('show');});

  render();
</script>
</body>
</html>
